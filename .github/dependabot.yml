# Keeps the pinned Python and npm dependencies, the SHA-pinned GitHub Actions and the Docker
# base images current. Every security-relevant pin in this repository is covered here, so a
# published fix shows up as a pull request instead of waiting for the next manual audit.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /tests-docker
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
    # Dockerfile.tests starts from ghcr.io/remimikalsen/python-testbed, an image the tests
    # workflow builds locally and never pushes. Dependabot cannot resolve it and aborts the
    # whole Docker job on it, so the file is left out.
    exclude-paths:
      - tests-docker/Dockerfile.tests
    ignore:
      # A new Python line (3.14 -> 3.15) is a deliberate decision, not a routine bump;
      # the floating "-slim" tag already picks up patch releases on every build.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
